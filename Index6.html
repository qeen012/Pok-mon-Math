<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可愛動物泡泡救援大冒險</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', '微軟正黑體', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background: linear-gradient(135deg, #d8e2dc 0%, #ffe5ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-card {
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 15px 35px rgba(142, 154, 175, 0.2);
      width: 100%;
      max-width: 440px;
      padding: 24px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部狀態列與計時器 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f4f1de;
      padding: 10px 14px;
      border-radius: 18px;
      margin-bottom: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #606c38;
    }

    .timer-pill {
      background: #f2cc8f;
      color: #3d405b;
      padding: 4px 10px;
      border-radius: 14px;
      font-weight: 700;
    }

    .ball-count {
      background: #e9edc9;
      padding: 4px 10px;
      border-radius: 14px;
      color: #2b9348;
    }

    /* 泡泡拯救區 */
    .bubble-stage {
      height: 190px;
      background: #f8f9fa;
      border-radius: 24px;
      border: 2px dashed #d8e2dc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .target-bubble {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: rgba(181, 131, 141, 0.2);
      border: 4px solid #b5838d;
      box-shadow: inset -6px -6px 15px rgba(181, 131, 141, 0.25), 0 10px 20px rgba(0,0,0,0.06);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: floatBubble 3s infinite ease-in-out alternate;
    }

    @keyframes floatBubble {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .animal-inside {
      font-size: 60px;
      line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12));
    }

    /* 超大題目區 */
    .question-box {
      background: #f4f1de;
      border-radius: 20px;
      padding: 14px 10px;
      margin: 16px 0 10px;
      font-size: 38px;
      font-weight: 700;
      color: #3d405b;
      letter-spacing: 2px;
    }

    /* 下方砲台區 */
    .shooter-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .ammo-options {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      width: 100%;
    }

    .ammo-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #e07a5f;
      color: white;
      border: none;
      font-size: 34px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 0 #c1121f, 0 10px 18px rgba(224, 122, 95, 0.25);
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ammo-btn:nth-child(1) { background: #81b29a; box-shadow: 0 7px 0 #3d5a80; }
    .ammo-btn:nth-child(2) { background: #f2cc8f; color: #3d405b; box-shadow: 0 7px 0 #e07a5f; }
    .ammo-btn:nth-child(3) { background: #3d405b; box-shadow: 0 7px 0 #1d3557; }

    .ammo-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #3d405b;
    }

    /* 圖鑑區 */
    .pokedex-box {
      margin-top: 16px;
      background: #f8f9fa;
      border-radius: 16px;
      padding: 10px;
      font-size: 13px;
      color: #6c757d;
      font-weight: 600;
    }

    .pokedex-list {
      font-size: 24px;
      margin-top: 4px;
      min-height: 32px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 彈窗 */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      border-radius: 32px;
      z-index: 10;
    }

    /* 英雄英雄卡片樣式 */
    .hero-card {
      background: linear-gradient(135deg, #fff3b0 0%, #e7c6ff 100%);
      border: 4px solid #ffb703;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(255, 183, 3, 0.3);
      width: 100%;
      margin: 10px 0;
      text-align: center;
    }

    .btn-start {
      background: #e07a5f;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 35px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c1121f;
      margin-top: 15px;
    }

    .btn-reset-time {
      background: transparent;
      color: #a0aec0;
      border: none;
      font-size: 12px;
      margin-top: 15px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- 頂部狀態與 5 分鐘計時器 -->
    <div class="status-bar">
      <span class="timer-pill">⏳ 剩餘: <span id="time-left">05:00</span></span>
      <span class="ball-count">⭐ 救出: <span id="saved-count">0</span> 隻</span>
    </div>

    <!-- 泡泡區 -->
    <div class="bubble-stage">
      <div class="target-bubble">
        <div class="animal-inside" id="current-animal">🐶</div>
      </div>
    </div>

    <!-- 超大題目 -->
    <div class="question-box" id="question">45 + 38 = ?</div>

    <div style="font-size: 13px; color: #8d99ae; font-weight: 600;">
      🎯 發射正確的數字泡泡，擊破拯救小動物！
    </div>

    <!-- 下方砲台 -->
    <div class="shooter-area">
      <div class="ammo-options" id="ammo-options">
        <button class="ammo-btn" onclick="shootBubble(0)">-</button>
        <button class="ammo-btn" onclick="shootBubble(1)">-</button>
        <button class="ammo-btn" onclick="shootBubble(2)">-</button>
      </div>
    </div>

    <div id="feedback" style="height: 22px; font-size: 15px; font-weight: bold; margin-top: 8px;"></div>

    <!-- 圖鑑 -->
    <div class="pokedex-box">
      🏆 我的可愛動物拯救圖鑑
      <div class="pokedex-list" id="pokedex-list">尚無拯救紀錄</div>
    </div>

    <!-- 開始 / 5分鐘時間到休息彈窗 -->
    <div class="overlay" id="overlay">
      <div id="overlay-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div style="font-size: 70px;">🐾</div>
        <h2 style="color: #3d405b; margin: 10px 0; font-size: 24px;">可愛動物泡泡救援！</h2>
        <p style="font-size: 15px; color: #6c757d; line-height: 1.6; text-align: center;">
          小動物被困在泡泡裡了！<br>算出正確的數學答案，拯救小動物吧！
        </p>
        <button class="btn-start" onclick="startGame()">開始 5 分鐘挑戰！</button>
      </div>
    </div>

  </div>

  <script>
    const animals = [
      { name: "🐶 狗狗", icon: "🐶" },
      { name: "🐱 貓咪", icon: "🐱" },
      { name: "🐰 兔子", icon: "🐰" },
      { name: "🐼 熊貓", icon: "🐼" },
      { name: "🦊 狐狸", icon: "🦊" },
      { name: "🐨 無尾熊", icon: "🐨" },
      { name: "🦁 獅子", icon: "🦁" },
      { name: "🐻 熊熊", icon: "🐻" },
      { name: "🐥 小雞", icon: "🐥" },
      { name: "🐹 倉鼠", icon: "🐹" }
    ];

    let savedCount = 0;
    let sessionSavedCount = 0; // 本次遊戲救出的隻數
    let currentAns = 0;
    let currentAnimalObj = null;
    let savedPokedex = [];

    // 5 分鐘計時器相關
    let totalSeconds = 300; // 5 分鐘 = 300 秒
    let timerInterval = null;
    let isGameActive = false;

    function loadSave() {
      const p = localStorage.getItem('animal_pokedex');
      const c = localStorage.getItem('animal_count');
      if (p) savedPokedex = JSON.parse(p);
      if (c) savedCount = parseInt(c);

      document.getElementById('saved-count').innerText = savedCount;
      updatePokedexUI();
    }

    function saveData() {
      localStorage.setItem('animal_pokedex', JSON.stringify(savedPokedex));
      localStorage.setItem('animal_count', savedCount);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'pop') {
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'wrong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function startGame() {
      document.getElementById('overlay').style.display = 'none';
      isGameActive = true;
      sessionSavedCount = 0;
      totalSeconds = 300;
      
      generateStage();
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        totalSeconds--;
        updateTimerDisplay();

        if (totalSeconds <= 0) {
          endGameTimeUp();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const mStr = mins < 10 ? '0' + mins : mins;
      const sStr = secs < 10 ? '0' + secs : secs;
      document.getElementById('time-left').innerText = `${mStr}:${sStr}`;
    }

    function endGameTimeUp() {
      clearInterval(timerInterval);
      isGameActive = false;

      // 觸發大彩帶慶祝
      confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });

      // 展示小武士英雄卡片彈窗
      const content = document.getElementById('overlay-content');
      content.innerHTML = `
        <div class="hero-card">
          <div style="font-size: 50px;">🎖️</div>
          <h2 style="color: #d97706; margin: 6px 0; font-size: 22px;">今日數學小武士卡</h2>
          <p style="font-size: 15px; color: #451a03; margin: 8px 0; line-height: 1.5;">
            <b>太棒了！5 分鐘任務完成！</b><br>
            你成功拯救了 <span style="font-size:22px; color:#e07a5f; font-weight:bold;">${sessionSavedCount}</span> 隻小動物！
          </p>
          <div style="font-size: 13px; color: #78350f; background: rgba(255,255,255,0.7); padding: 6px; border-radius: 10px;">
            ✨ 獲得稱號：<b>【泡泡救援小英雄】</b>
          </div>
        </div>

        <p style="font-size: 15px; color: #6c757d; margin-top: 10px; font-weight: 600;">
          👀 眼睛要休息囉！<br>小動物們要去睡午覺了，明天再來玩吧！
        </p>

        <button class="btn-reset-time" onclick="resetTimeByParent()">家長專用：重新解鎖 5 分鐘</button>
      `;

      document.getElementById('overlay').style.display = 'flex';
    }

    function resetTimeByParent() {
      const code = prompt("請輸入家長驗證碼（請輸入 123）：");
      if (code === "123") {
        document.getElementById('overlay-content').innerHTML = `
          <div style="font-size: 70px;">🐾</div>
          <h2 style="color: #3d405b; margin: 10px 0; font-size: 24px;">可愛動物泡泡救援！</h2>
          <p style="font-size: 15px; color: #6c757d; line-height: 1.6; text-align: center;">
            已解鎖！準備好開始新的 5 分鐘冒險了嗎？
          </p>
          <button class="btn-start" onclick="startGame()">開始 5 分鐘挑戰！</button>
        `;
      } else if (code !== null) {
        alert("密碼不正確喔！");
      }
    }

    function generateStage() {
      currentAnimalObj = animals[Math.floor(Math.random() * animals.length)];
      document.getElementById('current-animal').innerText = currentAnimalObj.icon;

      const type = Math.floor(Math.random() * 3);
      let num1, num2, ans, qText;

      if (type === 0) {
        const isAdd = Math.random() > 0.5;
        if (isAdd) {
          num1 = Math.floor(Math.random() * 40) + 25;
          num2 = Math.floor(Math.random() * 40) + 15;
          ans = num1 + num2;
          qText = `${num1} + ${num2} = ?`;
        } else {
          num1 = Math.floor(Math.random() * 50) + 40;
          num2 = Math.floor(Math.random() * 30) + 10;
          ans = num1 - num2;
          qText = `${num1} - ${num2} = ?`;
        }
      } else if (type === 1) {
        num1 = Math.floor(Math.random() * 8) + 2;
        num2 = Math.floor(Math.random() * 8) + 2;
        ans = num1 * num2;
        qText = `${num1} × ${num2} = ?`;
      } else {
        num2 = Math.floor(Math.random() * 8) + 2;
        const q = Math.floor(Math.random() * 9) + 2;
        num1 = num2 * q;
        ans = q;
        qText = `${num1} ÷ ${num2} = ?`;
      }

      currentAns = ans;
      document.getElementById('question').innerText = qText;

      let options = [ans];
      while (options.length < 3) {
        let offset = (Math.floor(Math.random() * 6) + 1) * (Math.random() > 0.5 ? 1 : -1);
        let wrong = ans + offset;
        if (wrong > 0 && !options.includes(wrong)) options.push(wrong);
      }
      options.sort(() => Math.random() - 0.5);

      const btns = document.querySelectorAll('.option-btn, .ammo-btn');
      btns.forEach((btn, i) => {
        btn.innerText = options[i];
        btn.dataset.val = options[i];
      });
    }

    function shootBubble(btnIdx) {
      if (!isGameActive) return;

      const btns = document.querySelectorAll('.ammo-btn');
      const val = parseInt(btns[btnIdx].dataset.val);
      const feedback = document.getElementById('feedback');

      if (val === currentAns) {
        playSound('pop');
        savedCount++;
        sessionSavedCount++;
        document.getElementById('saved-count').innerText = savedCount;

        if (!savedPokedex.includes(currentAnimalObj.icon)) {
          savedPokedex.push(currentAnimalObj.icon);
        }
        
        saveData();
        updatePokedexUI();

        confetti({ particleCount: 70, spread: 70, origin: { y: 0.6 } });

        feedback.style.color = '#2b9348';
        feedback.innerText = `✨ 啪！成功救出 ${currentAnimalObj.name}！`;

        setTimeout(() => {
          feedback.innerText = '';
          if (isGameActive) generateStage();
        }, 1200);

      } else {
        playSound('wrong');
        feedback.style.color = '#e07a5f';
        feedback.innerText = '🫧 泡泡彈開了，再算一次喔！';
      }
    }

    function updatePokedexUI() {
      const list = document.getElementById('pokedex-list');
      if (savedPokedex.length === 0) {
        list.innerText = "尚無拯救紀錄";
      } else {
        list.innerHTML = savedPokedex.map(a => `<span>${a}</span>`).join(' ');
      }
    }

    loadSave();
  </script>
</body>
</html>
