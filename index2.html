<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小小武士數學大冒險！</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', '微軟正黑體', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 440px;
      padding: 20px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 橫向地圖滾動區 */
    .map-container {
      background: #eef2ff;
      border-radius: 20px;
      padding: 15px 10px;
      margin-bottom: 15px;
      overflow-x: auto;
      border: 2px solid #c7d2fe;
    }

    .map-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 360px;
      position: relative;
    }

    .map-node {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #cbd5e1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      position: relative;
      transition: all 0.4s ease;
      z-index: 2;
    }

    .map-node.cleared {
      background: #10b981;
    }

    .map-node.active {
      background: #f59e0b;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
    }

    .map-node.boss {
      width: 50px;
      height: 50px;
      background: #ef4444;
      font-size: 24px;
    }

    /* 移動武士圖示 */
    .samurai-avatar-map {
      position: absolute;
      top: -22px;
      font-size: 22px;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 3;
    }

    .flag-icon {
      position: absolute;
      bottom: -18px;
      font-size: 14px;
    }

    /* 頂部資訊 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 16px;
      margin-bottom: 15px;
      font-size: 15px;
      font-weight: bold;
      color: #334155;
    }

    .gem-pill {
      background: #fef3c7;
      color: #d97706;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* 怪獸對戰區 */
    .battle-zone {
      background: #f1f5f9;
      border-radius: 20px;
      padding: 15px 10px;
      margin-bottom: 15px;
    }

    .monster-display {
      font-size: 65px;
      line-height: 1;
      margin: 8px 0;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
    }

    .hp-bar-container {
      background: #e2e8f0;
      border-radius: 10px;
      height: 12px;
      width: 80%;
      margin: 8px auto 4px;
      overflow: hidden;
    }

    .hp-bar-fill {
      background: linear-gradient(90deg, #ef4444, #10b981);
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    /* 題目區 */
    .question-box {
      font-size: 38px;
      font-weight: bold;
      color: #0f172a;
      margin: 12px 0;
      background: #fff;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #1d4ed8;
      transition: all 0.1s;
    }

    .option-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #1d4ed8;
    }

    .feedback {
      height: 24px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* 裝備欄位 */
    .equip-box {
      margin-top: 15px;
      background: #f8fafc;
      border-radius: 16px;
      padding: 10px;
      font-size: 13px;
      color: #64748b;
      font-weight: bold;
    }

    .equip-list {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 26px;
      margin-top: 6px;
      min-height: 36px;
    }

    /* 彈窗 */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-radius: 28px;
      z-index: 10;
    }

    .btn-action {
      background: #f59e0b;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 30px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #b45309;
      margin-top: 15px;
    }

    .btn-action:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b45309;
    }

    .btn-reset {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-card">

    <!-- 1. 橫向卷軸平面地圖 -->
    <div class="map-container">
      <div class="map-track">
        <div class="samurai-avatar-map" id="samurai-icon">🥷</div>
        <div class="map-node active" id="node-0">1</div>
        <div class="map-node" id="node-1">2</div>
        <div class="map-node" id="node-2">3</div>
        <div class="map-node" id="node-3">4</div>
        <div class="map-node" id="node-4">5</div>
        <div class="map-node boss" id="node-5">🏯</div>
      </div>
    </div>

    <!-- 2. 狀態列 -->
    <div class="top-bar">
      <span id="stage-name">第 1 關：竹林小徑</span>
      <span class="gem-pill">💎 寶石: <span id="gems">0</span></span>
    </div>

    <!-- 3. 小怪獸對戰區 -->
    <div class="battle-zone">
      <div id="monster-name" style="font-size: 14px; color: #64748b; font-weight: bold;">野生的怪獸出現了！</div>
      <div class="monster-display" id="monster-img">👾</div>
      <div class="hp-bar-container">
        <div class="hp-bar-fill" id="hp-fill"></div>
      </div>
      <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;" id="hp-text">HP: 5 / 5</div>
    </div>

    <!-- 4. 題目與選擇 -->
    <div class="question-box" id="question">12 + 8 = ?</div>

    <div class="options-grid">
      <button class="option-btn" onclick="checkAnswer(0)">-</button>
      <button class="option-btn" onclick="checkAnswer(1)">-</button>
      <button class="option-btn" onclick="checkAnswer(2)">-</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <!-- 5. 武士裝備庫 -->
    <div class="equip-box">
      🗡️ 小武士裝備庫 (已自動存檔)
      <div class="equip-list" id="equip-list">
        <span>🗡️</span><span>🛡️</span>
      </div>
      <button class="btn-reset" onclick="resetSaveData()">↺ 重置存檔</button>
    </div>

    <!-- 彈窗頁面 -->
    <div class="overlay" id="overlay">
      <div style="font-size: 70px;" id="pop-icon">🥷</div>
      <h2 id="pop-title" style="margin: 10px 0; color: #f59e0b;">小小武士出征！</h2>
      <p id="pop-msg" style="font-size: 15px; text-align: center; color: #cbd5e1; line-height: 1.6;">
        解開數學謎題打敗小怪獸！<br>闖過 5 關挑戰暗黑魔王城！
      </p>
      <button class="btn-action" id="pop-btn" onclick="closeOverlay()">開始挑戰！</button>
    </div>

  </div>

  <script>
    // 關卡與非動物怪獸資料
    const stageData = [
      { name: "第 1 關：竹林小徑", monsters: ["👾 鬼火怪"], hp: 5 },
      { name: "第 2 關：岩石荒野", monsters: ["🗿 岩石巨人"], hp: 5 },
      { name: "第 3 關：泥沼迷宮", monsters: ["🧌 泥巴怪"], hp: 5 },
      { name: "第 4 關：烈焰火山", monster: ["🔥 熔岩怪"], hp: 5 },
      { name: "第 5 關：風暴山頂", monsters: ["👁️ 惡魔之眼"], hp: 5 },
      { name: "第 6 關：魔王城", monsters: ["👹 暗黑將軍", "👿 影子魔王", "💀 骷髏王"], hp: 9 } // 魔王 3 隻怪，共 9 題
    ];

    // 隨機掉落的武士裝備列表
    const possibleEquips = ["🗡️ 武士名刀", "🥷 傳說兜帽", "🛡️ 黃金鎧甲", "🥊 龍之護手", "👟 飛天草鞋", "🔮 靈魂玉佩"];

    // 遊戲狀態與存檔變數
    let currentStage = 0;
    let currentHp = 5;
    let gems = 0;
    let currentAns = 0;
    let myEquips = ["🗡️"]; // 初始裝備

    // 讀取瀏覽器 LocalStorage 存檔
    function loadGame() {
      const savedStage = localStorage.getItem('samurai_stage');
      const savedGems = localStorage.getItem('samurai_gems');
      const savedEquips = localStorage.getItem('samurai_equips');

      if (savedStage !== null) currentStage = parseInt(savedStage);
      if (savedGems !== null) gems = parseInt(savedGems);
      if (savedEquips !== null) myEquips = JSON.parse(savedEquips);
    }

    // 儲存進度至 LocalStorage
    function saveGame() {
      localStorage.setItem('samurai_stage', currentStage);
      localStorage.setItem('samurai_gems', gems);
      localStorage.setItem('samurai_equips', JSON.stringify(myEquips));
    }

    function resetSaveData() {
      if (confirm("確定要重置所有進度和裝備嗎？")) {
        localStorage.clear();
        currentStage = 0;
        gems = 0;
        myEquips = ["🗡️"];
        saveGame();
        initStage();
      }
    }

    // Web Audio 音效產生器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function initStage() {
      const stage = stageData[currentStage];
      currentHp = stage.hp;

      document.getElementById('stage-name').innerText = stage.name;
      document.getElementById('gems').innerText = gems;
      document.getElementById('monster-name').innerText = `正在挑戰：${stage.monsters[0]}`;
      document.getElementById('monster-img').innerText = stage.monsters[0].split(' ')[0];

      updateHpBar();
      updateMapUI();
      updateEquipUI();
      generateQuestion();
    }

    function updateHpBar() {
      const stage = stageData[currentStage];
      const pct = (currentHp / stage.hp) * 100;
      document.getElementById('hp-fill').style.width = `${pct}%`;
      document.getElementById('hp-text').innerText = `HP: ${currentHp} / ${stage.hp}`;

      // 魔王關卡切換怪獸頭像
      if (currentStage === 5) {
        if (currentHp > 6) {
          document.getElementById('monster-name').innerText = `魔王 1/3：${stage.monsters[0]}`;
          document.getElementById('monster-img').innerText = "👹";
        } else if (currentHp > 3) {
          document.getElementById('monster-name').innerText = `魔王 2/3：${stage.monsters[1]}`;
          document.getElementById('monster-img').innerText = "👿";
        } else {
          document.getElementById('monster-name').innerText = `魔王 3/3：${stage.monsters[2]}`;
          document.getElementById('monster-img').innerText = "💀";
        }
      }
    }

    function updateMapUI() {
      const samurai = document.getElementById('samurai-icon');
      
      for (let i = 0; i < 6; i++) {
        const node = document.getElementById(`node-${i}`);
        node.className = 'map-node' + (i === 5 ? ' boss' : '');

        // 清除舊旗子
        const oldFlag = node.querySelector('.flag-icon');
        if (oldFlag) oldFlag.remove();

        if (i < currentStage) {
          node.classList.add('cleared');
          // 插上勝旗
          const flag = document.createElement('span');
          flag.className = 'flag-icon';
          flag.innerText = '🚩';
          node.appendChild(flag);
        } else if (i === currentStage) {
          node.classList.add('active');
          // 移動武士頭像到當前節點位置
          const nodeRect = node.offsetLeft;
          samurai.style.left = `${nodeRect + 10}px`;
        }
      }
    }

    function updateEquipUI() {
      const container = document.getElementById('equip-list');
      container.innerHTML = myEquips.map(e => `<span>${e.split(' ')[0]}</span>`).join('');
    }

    function generateQuestion() {
      const type = Math.floor(Math.random() * 3);
      let num1, num2, ans, qText;

      if (type === 0) {
        const isAdd = Math.random() > 0.5;
        if (isAdd) {
          num1 = Math.floor(Math.random() * 30) + 1;
          num2 = Math.floor(Math.random() * (50 - num1)) + 1;
          ans = num1 + num2;
          qText = `${num1} + ${num2} = ?`;
        } else {
          num1 = Math.floor(Math.random() * 40) + 10;
          num2 = Math.floor(Math.random() * num1) + 1;
          ans = num1 - num2;
          qText = `${num1} - ${num2} = ?`;
        }
      } else if (type === 1) {
        num1 = Math.floor(Math.random() * 9) + 1;
        num2 = Math.floor(Math.random() * 9) + 1;
        ans = num1 * num2;
        qText = `${num1} × ${num2} = ?`;
      } else {
        num2 = Math.floor(Math.random() * 8) + 2;
        const quotient = Math.floor(Math.random() * 9) + 1;
        num1 = num2 * quotient;
        ans = quotient;
        qText = `${num1} ÷ ${num2} = ?`;
      }

      currentAns = ans;
      document.getElementById('question').innerText = qText;

      let opts = [ans];
      while (opts.length < 3) {
        let offset = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
        let wrong = ans + offset;
        if (wrong >= 0 && !opts.includes(wrong)) opts.push(wrong);
      }
      opts.sort(() => Math.random() - 0.5);

      const btns = document.querySelectorAll('.option-btn');
      btns.forEach((btn, i) => {
        btn.innerText = opts[i];
        btn.dataset.val = opts[i];
      });
    }

    function checkAnswer(idx) {
      const btns = document.querySelectorAll('.option-btn');
      const val = parseInt(btns[idx].dataset.val);
      const feedback = document.getElementById('feedback');

      if (val === currentAns) {
        gems += 2;
        currentHp -= 1;
        document.getElementById('gems').innerText = gems;
        feedback.style.color = '#10b981';
        feedback.innerText = '⚔️ 揮劍擊中！寶石 +2';
        playSound('correct');
        updateHpBar();

        if (currentHp <= 0) {
          stageClear();
        } else {
          generateQuestion();
        }
      } else {
        feedback.style.color = '#ef4444';
        feedback.innerText = '🛡️ 被怪獸格擋了，再試一次！';
        playSound('wrong');
      }
    }

    function stageClear() {
      // 隨機獲得新裝備
      const randomEquip = possibleEquips[Math.floor(Math.random() * possibleEquips.length)];
      if (!myEquips.includes(randomEquip)) {
        myEquips.push(randomEquip);
      }

      confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });

      if (currentStage < 5) {
        currentStage++;
        saveGame();
        showOverlay('🚩 關卡突破！插上勝旗！', `擊敗怪獸！武士向前邁進！<br>🎁 打開寶箱獲得：<b>${randomEquip}</b>！`, '🚩 下一關');
      } else {
        // 全通關
        gems += 50;
        currentStage = 0;
        saveGame();
        confetti({ particleCount: 250, spread: 120, origin: { y: 0.5 } });
        showOverlay('👑 成功征服魔王城！', `你是最強的數學大武士！<br>獲得 50 顆大寶石與寶箱裝備！`, '🔄 重新遠征');
      }
    }

    function showOverlay(title, msg, btnText) {
      document.getElementById('pop-title').innerText = title;
      document.getElementById('pop-msg').innerHTML = msg;
      document.getElementById('pop-btn').innerText = btnText;
      document.getElementById('overlay').style.display = 'flex';
    }

    function closeOverlay() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('feedback').innerText = '';
      initStage();
    }

    // 啟動遊戲與載入存檔
    loadGame();
    initStage();
  </script>
</body>
</html>
