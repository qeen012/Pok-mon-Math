<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可愛動物泡泡救援大冒險</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', '微軟正黑體', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      /* 莫蘭迪柔和低彩度漸層 */
      background: linear-gradient(135deg, #d8e2dc 0%, #ffe5ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-card {
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 15px 35px rgba(142, 154, 175, 0.2);
      width: 100%;
      max-width: 440px;
      padding: 24px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部狀態列 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f4f1de;
      padding: 10px 16px;
      border-radius: 18px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #606c38;
    }

    .ball-count {
      background: #e9edc9;
      padding: 4px 12px;
      border-radius: 14px;
      color: #2b9348;
    }

    /* 泡泡救援主區域 (單隻動物) */
    .bubble-stage {
      height: 200px;
      background: #f8f9fa;
      border-radius: 24px;
      border: 2px dashed #d8e2dc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 單隻動物的大泡泡 */
    .target-bubble {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(181, 131, 141, 0.2);
      border: 4px solid #b5838d;
      box-shadow: inset -6px -6px 15px rgba(181, 131, 141, 0.25), 0 10px 20px rgba(0,0,0,0.06);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: floatBubble 3s infinite ease-in-out alternate;
    }

    @keyframes floatBubble {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .animal-inside {
      font-size: 65px;
      line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12));
    }

    /* 超大字體題目區 */
    .question-box {
      background: #f4f1de;
      border-radius: 20px;
      padding: 16px 10px;
      margin: 18px 0 12px;
      font-size: 38px;
      font-weight: 700;
      color: #3d405b;
      letter-spacing: 2px;
    }

    /* 下方超大按鈕砲台區 */
    .shooter-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .ammo-options {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      width: 100%;
    }

    .ammo-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #e07a5f;
      color: white;
      border: none;
      font-size: 34px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 0 #c1121f, 0 10px 18px rgba(224, 122, 95, 0.25);
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ammo-btn:nth-child(1) { background: #81b29a; box-shadow: 0 7px 0 #3d5a80; }
    .ammo-btn:nth-child(2) { background: #f2cc8f; color: #3d405b; box-shadow: 0 7px 0 #e07a5f; }
    .ammo-btn:nth-child(3) { background: #3d405b; box-shadow: 0 7px 0 #1d3557; }

    .ammo-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #3d405b;
    }

    /* 動物拯救圖鑑 */
    .pokedex-box {
      margin-top: 18px;
      background: #f8f9fa;
      border-radius: 16px;
      padding: 12px;
      font-size: 14px;
      color: #6c757d;
      font-weight: 600;
    }

    .pokedex-list {
      font-size: 26px;
      margin-top: 6px;
      min-height: 36px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 彈窗 */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      border-radius: 32px;
      z-index: 10;
    }

    .btn-start {
      background: #e07a5f;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 14px 40px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c1121f;
      margin-top: 18px;
    }

    .btn-start:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c1121f;
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- 頂部狀態列 -->
    <div class="status-bar">
      <span>🐾 可愛動物拯救隊</span>
      <span class="ball-count">⭐ 已救出: <span id="saved-count">0</span> 隻</span>
    </div>

    <!-- 泡泡拯救區 (單隻動物) -->
    <div class="bubble-stage">
      <div class="target-bubble">
        <div class="animal-inside" id="current-animal">🐶</div>
      </div>
    </div>

    <!-- 超大題目區域 -->
    <div class="question-box" id="question">45 + 38 = ?</div>

    <div style="font-size: 14px; color: #8d99ae; font-weight: 600;">
      🎯 發射正確的數字泡泡，擊破拯救小動物！
    </div>

    <!-- 下方超大發射砲台 -->
    <div class="shooter-area">
      <div class="ammo-options" id="ammo-options">
        <button class="ammo-btn" onclick="shootBubble(0)">-</button>
        <button class="ammo-btn" onclick="shootBubble(1)">-</button>
        <button class="ammo-btn" onclick="shootBubble(2)">-</button>
      </div>
    </div>

    <div id="feedback" style="height: 24px; font-size: 16px; font-weight: bold; margin-top: 10px;"></div>

    <!-- 動物圖鑑 -->
    <div class="pokedex-box">
      🏆 我的可愛動物拯救圖鑑 (已自動記錄)
      <div class="pokedex-list" id="pokedex-list">尚無拯救紀錄</div>
    </div>

    <!-- 啟動彈窗 -->
    <div class="overlay" id="overlay">
      <div style="font-size: 75px;">🫧</div>
      <h2 style="color: #3d405b; margin: 12px 0; font-size: 26px;">可愛動物泡泡救援！</h2>
      <p style="font-size: 16px; color: #6c757d; line-height: 1.6; text-align: center;">
        小動物被困在泡泡裡了！<br>算出正確的數學答案，發射砲台擊破泡泡救出牠們吧！
      </p>
      <button class="btn-start" onclick="closeOverlay()">開始救援！</button>
    </div>

  </div>

  <script>
    // 可愛動物資料庫
    const animals = [
      { name: "🐶 狗狗", icon: "🐶" },
      { name: "🐱 貓咪", icon: "🐱" },
      { name: "🐰 兔子", icon: "🐰" },
      { name: "🐼 熊貓", icon: "🐼" },
      { name: "🦊 狐狸", icon: "🦊" },
      { name: "🐨 無尾熊", icon: "🐨" },
      { name: "🦁 獅子", icon: "🦁" },
      { name: "🐻 熊熊", icon: "🐻" },
      { name: "🐥 小雞", icon: "🐥" },
      { name: "🐹 倉鼠", icon: "🐹" }
    ];

    let savedCount = 0;
    let currentAns = 0;
    let currentAnimalObj = null;
    let savedPokedex = [];

    // 讀取進度
    function loadSave() {
      const p = localStorage.getItem('animal_pokedex');
      const c = localStorage.getItem('animal_count');
      if (p) savedPokedex = JSON.parse(p);
      if (c) savedCount = parseInt(c);

      document.getElementById('saved-count').innerText = savedCount;
      updatePokedexUI();
    }

    function saveData() {
      localStorage.setItem('animal_pokedex', JSON.stringify(savedPokedex));
      localStorage.setItem('animal_count', savedCount);
    }

    // 音效產生器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'pop') {
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'wrong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function generateStage() {
      // 隨機選出一隻被困住的小動物
      currentAnimalObj = animals[Math.floor(Math.random() * animals.length)];
      document.getElementById('current-animal').innerText = currentAnimalObj.icon;

      // 產生大數字題庫 (50~100 加減、九九乘法、除法)
      const type = Math.floor(Math.random() * 3);
      let num1, num2, ans, qText;

      if (type === 0) {
        const isAdd = Math.random() > 0.5;
        if (isAdd) {
          num1 = Math.floor(Math.random() * 40) + 25;
          num2 = Math.floor(Math.random() * 40) + 15;
          ans = num1 + num2;
          qText = `${num1} + ${num2} = ?`;
        } else {
          num1 = Math.floor(Math.random() * 50) + 40;
          num2 = Math.floor(Math.random() * 30) + 10;
          ans = num1 - num2;
          qText = `${num1} - ${num2} = ?`;
        }
      } else if (type === 1) {
        num1 = Math.floor(Math.random() * 8) + 2;
        num2 = Math.floor(Math.random() * 8) + 2;
        ans = num1 * num2;
        qText = `${num1} × ${num2} = ?`;
      } else {
        num2 = Math.floor(Math.random() * 8) + 2;
        const q = Math.floor(Math.random() * 9) + 2;
        num1 = num2 * q;
        ans = q;
        qText = `${num1} ÷ ${num2} = ?`;
      }

      currentAns = ans;
      document.getElementById('question').innerText = qText;

      // 產生選項 (1個正確，2個干擾)
      let options = [ans];
      while (options.length < 3) {
        let offset = (Math.floor(Math.random() * 6) + 1) * (Math.random() > 0.5 ? 1 : -1);
        let wrong = ans + offset;
        if (wrong > 0 && !options.includes(wrong)) options.push(wrong);
      }
      options.sort(() => Math.random() - 0.5);

      // 設定砲台按鈕數字
      const btns = document.querySelectorAll('.ammo-btn');
      btns.forEach((btn, i) => {
        btn.innerText = options[i];
        btn.dataset.val = options[i];
      });
    }

    function shootBubble(btnIdx) {
      const btns = document.querySelectorAll('.ammo-btn');
      const val = parseInt(btns[btnIdx].dataset.val);
      const feedback = document.getElementById('feedback');

      if (val === currentAns) {
        playSound('pop');
        savedCount++;
        document.getElementById('saved-count').innerText = savedCount;

        if (!savedPokedex.includes(currentAnimalObj.icon)) {
          savedPokedex.push(currentAnimalObj.icon);
        }
        
        saveData();
        updatePokedexUI();

        confetti({ particleCount: 70, spread: 70, origin: { y: 0.6 } });

        feedback.style.color = '#2b9348';
        feedback.innerText = `✨ 啪！成功救出 ${currentAnimalObj.name}！`;

        setTimeout(() => {
          feedback.innerText = '';
          generateStage();
        }, 1200);

      } else {
        playSound('wrong');
        feedback.style.color = '#e07a5f';
        feedback.innerText = '🫧 泡泡彈開了，再算一次喔！';
      }
    }

    function updatePokedexUI() {
      const list = document.getElementById('pokedex-list');
      if (savedPokedex.length === 0) {
        list.innerText = "尚無拯救紀錄";
      } else {
        list.innerHTML = savedPokedex.map(a => `<span>${a}</span>`).join(' ');
      }
    }

    function closeOverlay() {
      document.getElementById('overlay').style.display = 'none';
      loadSave();
      generateStage();
    }
  </script>
</body>
</html>
