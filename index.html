<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢泡泡救援大冒險</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', '微軟正黑體', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      /* 柔和莫蘭迪漸層 */
      background: linear-gradient(135deg, #d8e2dc 0%, #ffe5ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(142, 154, 175, 0.2);
      width: 100%;
      max-width: 420px;
      padding: 20px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部狀態列 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f4f1de;
      padding: 8px 14px;
      border-radius: 16px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #606c38;
    }

    .ball-count {
      background: #e9edc9;
      padding: 4px 10px;
      border-radius: 12px;
      color: #2b9348;
    }

    /* 泡泡區域 */
    .bubble-stage {
      height: 220px;
      background: #f8f9fa;
      border-radius: 20px;
      border: 2px dashed #d8e2dc;
      position: relative;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      overflow: hidden;
    }

    /* 被包住的寶可夢泡泡 (莫蘭迪色) */
    .target-bubble {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: rgba(181, 131, 141, 0.25);
      border: 3px solid #b5838d;
      box-shadow: inset -5px -5px 12px rgba(181, 131, 141, 0.3), 0 8px 15px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
      animation: floatBubble 3s infinite ease-in-out alternate;
    }

    .target-bubble:nth-child(2) { animation-delay: 0.5s; background: rgba(109, 104, 117, 0.2); border-color: #6d6875; }
    .target-bubble:nth-child(3) { animation-delay: 1s; background: rgba(229, 152, 155, 0.25); border-color: #e5989b; }

    @keyframes floatBubble {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .pokemon-inside {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .bubble-num {
      font-size: 18px;
      font-weight: bold;
      color: #3d405b;
      margin-top: 2px;
      background: rgba(255,255,255,0.8);
      padding: 1px 8px;
      border-radius: 10px;
    }

    /* 題目顯示區 */
    .question-box {
      background: #f4f1de;
      border-radius: 16px;
      padding: 12px;
      margin: 15px 0 10px;
      font-size: 32px;
      font-weight: 700;
      color: #3d405b;
      letter-spacing: 1px;
    }

    /* 下方砲台區 */
    .shooter-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .ammo-options {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .ammo-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #e07a5f;
      color: white;
      border: none;
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #d00000, 0 8px 15px rgba(224, 122, 95, 0.3);
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ammo-btn:nth-child(1) { background: #81b29a; box-shadow: 0 6px 0 #3d5a80; }
    .ammo-btn:nth-child(2) { background: #f2cc8f; color: #3d405b; box-shadow: 0 6px 0 #e07a5f; }
    .ammo-btn:nth-child(3) { background: #3d405b; box-shadow: 0 6px 0 #1d3557; }

    .ammo-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #3d405b;
    }

    /* 拯救圖鑑欄 */
    .pokedex-box {
      margin-top: 15px;
      background: #f8f9fa;
      border-radius: 14px;
      padding: 8px;
      font-size: 12px;
      color: #6c757d;
      font-weight: 600;
    }

    .pokedex-list {
      font-size: 22px;
      margin-top: 4px;
      min-height: 28px;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    /* 彈窗 */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-radius: 28px;
      z-index: 10;
    }

    .btn-start {
      background: #e07a5f;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 35px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c1121f;
      margin-top: 15px;
    }

    .btn-start:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c1121f;
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- 頂部狀態 -->
    <div class="status-bar">
      <span>🎒 寶可夢拯救隊</span>
      <span class="ball-count">🔴 已救出: <span id="saved-count">0</span> 隻</span>
    </div>

    <!-- 泡泡關卡區 (被困住的寶可夢) -->
    <div class="bubble-stage" id="bubble-stage">
      <!-- 由 JS 動態生成 3 個泡泡 -->
    </div>

    <!-- 題目區域 -->
    <div class="question-box" id="question">45 + 38 = ?</div>

    <div style="font-size: 13px; color: #8d99ae; font-weight: 600;">
      🎯 點擊下方砲台，發射正確數字泡泡擊破拯救！
    </div>

    <!-- 下方發射砲台 -->
    <div class="shooter-area">
      <div class="ammo-options" id="ammo-options">
        <button class="ammo-btn" onclick="shootBubble(0)">-</button>
        <button class="ammo-btn" onclick="shootBubble(1)">-</button>
        <button class="ammo-btn" onclick="shootBubble(2)">-</button>
      </div>
    </div>

    <div id="feedback" style="height: 22px; font-size: 15px; font-weight: bold; margin-top: 8px;"></div>

    <!-- 我的拯救圖鑑 -->
    <div class="pokedex-box">
      🏆 我的寶可夢拯救圖鑑：
      <div class="pokedex-list" id="pokedex-list">尚無拯救紀錄</div>
    </div>

    <!-- 開始/過關彈窗 -->
    <div class="overlay" id="overlay">
      <div style="font-size: 70px;">🫧</div>
      <h2 style="color: #3d405b; margin: 10px 0; font-size: 24px;">寶可夢泡泡救援戰！</h2>
      <p style="font-size: 15px; color: #6c757d; line-height: 1.6; text-align: center;">
        寶可夢被困在數字泡泡裡了！<br>算出數學答案，發射砲台擊破泡泡救出牠們！
      </p>
      <button class="btn-start" onclick="closeOverlay()">開始救援！</button>
    </div>

  </div>

  <script>
    // 寶可夢角色庫
    const pokemons = ["⚡皮卡丘", "🔥小火龍", "🐢傑尼龜", "🍃妙蛙種子", "🎀伊布", "🎤胖丁", "🦆可達鴨", "🌸波克比"];

    let savedCount = 0;
    let currentAns = 0;
    let targetBubblesData = [];
    let savedPokedex = [];

    // 音效產生器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'pop') {
        // 泡泡破裂聲 (Pop!)
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'wrong') {
        // 彈開聲
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function generateStage() {
      // 1. 生成大數字題目 (50~100 加減、乘法、除法)
      const type = Math.floor(Math.random() * 3);
      let num1, num2, ans, qText;

      if (type === 0) {
        // 50~100 加減法
        const isAdd = Math.random() > 0.5;
        if (isAdd) {
          num1 = Math.floor(Math.random() * 40) + 20;
          num2 = Math.floor(Math.random() * 40) + 10;
          ans = num1 + num2;
          qText = `${num1} + ${num2} = ?`;
        } else {
          num1 = Math.floor(Math.random() * 50) + 40;
          num2 = Math.floor(Math.random() * 30) + 10;
          ans = num1 - num2;
          qText = `${num1} - ${num2} = ?`;
        }
      } else if (type === 1) {
        // 九九乘法表
        num1 = Math.floor(Math.random() * 8) + 2;
        num2 = Math.floor(Math.random() * 8) + 2;
        ans = num1 * num2;
        qText = `${num1} × ${num2} = ?`;
      } else {
        // 兩位數除法
        num2 = Math.floor(Math.random() * 8) + 2;
        const q = Math.floor(Math.random() * 9) + 2;
        num1 = num2 * q;
        ans = q;
        qText = `${num1} ÷ ${num2} = ?`;
      }

      currentAns = ans;
      document.getElementById('question').innerText = qText;

      // 2. 產生 3 個目標泡泡 (1個正確答案，2個干擾選項)
      let options = [ans];
      while (options.length < 3) {
        let offset = (Math.floor(Math.random() * 6) + 1) * (Math.random() > 0.5 ? 1 : -1);
        let wrong = ans + offset;
        if (wrong > 0 && !options.includes(wrong)) options.push(wrong);
      }
      options.sort(() => Math.random() - 0.5);

      // 3. 渲染上方的寶可夢泡泡
      const stage = document.getElementById('bubble-stage');
      stage.innerHTML = '';
      targetBubblesData = [];

      options.forEach((val, idx) => {
        const randPoke = pokemons[Math.floor(Math.random() * pokemons.length)];
        const pokeIcon = randPoke.substring(0, 2);
        
        targetBubblesData.push({ val: val, poke: randPoke });

        const bEl = document.createElement('div');
        bEl.className = 'target-bubble';
        bEl.id = `target-${idx}`;
        bEl.innerHTML = `
          <div class="pokemon-inside">${pokeIcon}</div>
          <div class="bubble-num">${val}</div>
        `;
        stage.appendChild(bEl);
      });

      // 4. 洗牌砲台發射選項
      let ammoOptions = [...options].sort(() => Math.random() - 0.5);
      const btns = document.querySelectorAll('.ammo-btn');
      btns.forEach((btn, i) => {
        btn.innerText = ammoOptions[i];
        btn.dataset.val = ammoOptions[i];
      });
    }

    function shootBubble(btnIdx) {
      const btns = document.querySelectorAll('.ammo-btn');
      const val = parseInt(btns[btnIdx].dataset.val);
      const feedback = document.getElementById('feedback');

      if (val === currentAns) {
        // 擊中正確泡泡！
        playSound('pop');
        savedCount++;
        document.getElementById('saved-count').innerText = savedCount;

        // 找到正確的泡泡視覺元素
        const correctTargetObj = targetBubblesData.find(t => t.val === currentAns);
        const correctPokeName = correctTargetObj.poke;
        
        if (!savedPokedex.includes(correctPokeName.substring(0,2))) {
          savedPokedex.push(correctPokeName.substring(0,2));
        }
        updatePokedexUI();

        // 歡慶彩帶
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } });

        feedback.style.color = '#2b9348';
        feedback.innerText = `✨ 啪！成功救出 ${correctPokeName}！`;

        setTimeout(() => {
          feedback.innerText = '';
          generateStage();
        }, 1200);

      } else {
        // 射錯彈開
        playSound('wrong');
        feedback.style.color = '#e07a5f';
        feedback.innerText = '🫧 泡泡彈開了，再算一次喔！';
      }
    }

    function updatePokedexUI() {
      const list = document.getElementById('pokedex-list');
      if (savedPokedex.length === 0) {
        list.innerText = "尚無拯救紀錄";
      } else {
        list.innerHTML = savedPokedex.map(p => `<span>${p}</span>`).join(' ');
      }
    }

    function closeOverlay() {
      document.getElementById('overlay').style.display = 'none';
      generateStage();
    }
  </script>
</body>
</html>
