<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢數學大冒險！</title>
  <!-- 引入彩帶特效庫 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', 'Comic Sans MS', '微軟正黑體', sans-serif;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      background: linear-gradient(135deg, #74ebe5 0%, #ece9e6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-card {
      background: #ffffff;
      border: 8px solid #ffcb05; /* 皮卡丘黃 */
      border-radius: 30px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 500px;
      padding: 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部 PokeBall 裝飾標誌 */
    .pokeball-header {
      width: 50px;
      height: 50px;
      background: linear-gradient(to bottom, #ff0000 50%, #ffffff 50%);
      border-radius: 50%;
      border: 4px solid #333;
      margin: 0 auto 10px;
      position: relative;
    }
    .pokeball-header::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: #fff;
      border: 3px solid #333;
      border-radius: 50%;
    }

    .title {
      color: #2a75bb;
      font-size: 28px;
      font-weight: bold;
      margin: 0 0 15px 0;
      text-shadow: 2px 2px #ffcb05;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: bold;
      background: #f0f4f8;
      padding: 12px 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 2px solid #2a75bb;
    }

    .timer { color: #e3350d; }
    .score { color: #2a75bb; }

    .question-box {
      background: #fff9d6;
      border: 4px dashed #ffcb05;
      border-radius: 20px;
      padding: 25px 10px;
      margin-bottom: 25px;
      font-size: 48px;
      font-weight: bold;
      color: #333;
      min-height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .option-btn {
      background: #3b4cca;
      color: white;
      border: 4px solid #ffcb05;
      border-radius: 25px;
      padding: 18px;
      font-size: 36px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 6px 0 #2a75bb;
      outline: none;
    }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2a75bb;
    }

    .feedback {
      height: 35px;
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
    }
    .feedback.correct { color: #4caf50; }
    .feedback.wrong { color: #f44336; }

    /* 結束畫面 */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-radius: 22px;
      z-index: 10;
    }

    .start-btn, .restart-btn {
      background: #ff0000;
      color: white;
      border: 4px solid #333;
      border-radius: 50px;
      padding: 15px 40px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #990000;
      margin-top: 20px;
    }

    .start-btn:active, .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #990000;
    }

    .pokemon-avatar {
      font-size: 70px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="pokeball-header"></div>
    <h1 class="title">⚡ 寶可夢數學大挑戰 ⚡</h1>

    <div class="status-bar">
      <div class="timer">⏳ 時間: <span id="time">60</span>s</div>
      <div class="score">⭐ 分數: <span id="score">0</span></div>
    </div>

    <div class="question-box" id="question">準備好了嗎？</div>

    <div class="options-grid" id="options">
      <button class="option-btn" onclick="checkAnswer(0)">-</button>
      <button class="option-btn" onclick="checkAnswer(1)">-</button>
      <button class="option-btn" onclick="checkAnswer(2)">-</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <!-- 遊戲開始/結束 彈窗 -->
    <div class="overlay" id="overlay">
      <div class="pokemon-avatar" id="end-avatar">⚡</div>
      <h2 id="end-title" style="font-size: 32px; color: #2a75bb; margin: 10px 0;">準備好挑戰了嗎？</h2>
      <p id="end-msg" style="font-size: 20px; color: #555; margin: 0;">包含 50以內加減、九九乘法與除法！</p>
      <button class="start-btn" id="action-btn" onclick="startGame()">開始遊戲！</button>
    </div>
  </div>

  <script>
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let currentCorrectAnswer = 0;
    let isGameRunning = false;

    // 音效合成器 (免外部檔)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        // 歡樂音效 (Do-Mi-Sol-Do)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        let now = audioCtx.currentTime;
        notes.forEach((freq, index) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.frequency.value = freq;
          o.connect(g);
          g.connect(audioCtx.destination);
          g.gain.setValueAtTime(0.15, now + index * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.15);
          o.start(now + index * 0.08);
          o.stop(now + index * 0.08 + 0.15);
        });
      } else if (type === 'wrong') {
        // 答錯提示音 (低音咚)
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function startGame() {
      score = 0;
      timeLeft = 60;
      isGameRunning = true;
      document.getElementById('score').innerText = score;
      document.getElementById('time').innerText = timeLeft;
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('feedback').innerText = '';

      generateQuestion();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('time').innerText = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function generateQuestion() {
      // 題型 0: 50以內加減, 1: 99乘法, 2: 兩位數整除法
      const type = Math.floor(Math.random() * 3);
      let num1, num2, answer, qText;

      if (type === 0) {
        // 50以內加減
        const isAdd = Math.random() > 0.5;
        if (isAdd) {
          num1 = Math.floor(Math.random() * 30) + 1;
          num2 = Math.floor(Math.random() * (50 - num1)) + 1;
          answer = num1 + num2;
          qText = `${num1} + ${num2} = ?`;
        } else {
          num1 = Math.floor(Math.random() * 40) + 10;
          num2 = Math.floor(Math.random() * num1) + 1;
          answer = num1 - num2;
          qText = `${num1} - ${num2} = ?`;
        }
      } else if (type === 1) {
        // 九九乘法表
        num1 = Math.floor(Math.random() * 9) + 1;
        num2 = Math.floor(Math.random() * 9) + 1;
        answer = num1 * num2;
        qText = `${num1} × ${num2} = ?`;
      } else {
        // 兩位數以內除法 (確保可整除)
        num2 = Math.floor(Math.random() * 8) + 2; // 除數 2~9
        const quotient = Math.floor(Math.random() * 9) + 1; // 商 1~9
        num1 = num2 * quotient; // 被除數
        answer = quotient;
        qText = `${num1} ÷ ${num2} = ?`;
      }

      currentCorrectAnswer = answer;
      document.getElementById('question').innerText = qText;

      // 產生選項 (1個正確，2個干擾)
      let options = [answer];
      while (options.length < 3) {
        let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
        let wrongOpt = answer + offset;
        if (wrongOpt >= 0 && !options.includes(wrongOpt)) {
          options.push(wrongOpt);
        }
      }

      // 洗牌選項
      options.sort(() => Math.random() - 0.5);

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.innerText = options[idx];
        btn.dataset.value = options[idx];
      });
    }

    function checkAnswer(index) {
      if (!isGameRunning) return;

      const buttons = document.querySelectorAll('.option-btn');
      const selectedValue = parseInt(buttons[index].dataset.value);
      const feedbackEl = document.getElementById('feedback');

      if (selectedValue === currentCorrectAnswer) {
        // 答對
        score += 10;
        document.getElementById('score').innerText = score;
        feedbackEl.className = 'feedback correct';
        feedbackEl.innerText = '✨ 太棒了！答對了！';
        playSound('correct');

        // 拉彩炮特效
        confetti({
          particleCount: 50,
          spread: 60,
          origin: { y: 0.7 }
        });

        generateQuestion();
      } else {
        // 答錯
        feedbackEl.className = 'feedback wrong';
        feedbackEl.innerText = '❌ 再試一次看看喔！';
        playSound('wrong');
      }
    }

    function endGame() {
      clearInterval(timerInterval);
      isGameRunning = false;
      const overlay = document.getElementById('overlay');
      const title = document.getElementById('end-title');
      const msg = document.getElementById('end-msg');
      const avatar = document.getElementById('end-avatar');
      const btn = document.getElementById('action-btn');

      title.innerText = '時間到！挑戰結束！';
      msg.innerText = `你獲得了 ${score} 分！`;
      btn.innerText = '再玩一次 ↺';

      if (score >= 100) {
        avatar.innerText = '🏆';
        msg.innerText += ' 你是神奇寶貝大師！';
      } else if (score >= 50) {
        avatar.innerText = '⚡';
        msg.innerText += ' 很厲害喔，繼續加油！';
      } else {
        avatar.innerText = '🔴';
        msg.innerText += ' 再多練習一下會更好喔！';
      }

      overlay.style.display = 'flex';
      
      // 結算大彩炮
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.5 }
      });
    }
  </script>
</body>
</html>
